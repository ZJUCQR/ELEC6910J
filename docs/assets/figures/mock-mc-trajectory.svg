<text x="24" y="28" font-size="18" text-anchor="start" fill="#66766e" font-weight="400">γ = 0.5；T 为终止态</text><circle cx="80" cy="95" r="40" fill="#eaf3ee" stroke="#365f51" stroke-width="2"/><text x="80" y="104" font-size="28" text-anchor="middle" fill="#213b33" font-weight="600">A</text><text x="80" y="165" font-size="17" text-anchor="middle" fill="#66766e" font-weight="400">t = 0</text><path d="M125 95 H233" stroke="#365f51" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="76" font-size="19" text-anchor="middle" fill="#213b33" font-weight="400">R₁ = 1</text><circle cx="280" cy="95" r="40" fill="#eaf3ee" stroke="#365f51" stroke-width="2"/><text x="280" y="104" font-size="28" text-anchor="middle" fill="#213b33" font-weight="600">B</text><text x="280" y="165" font-size="17" text-anchor="middle" fill="#66766e" font-weight="400">t = 1</text><path d="M325 95 H433" stroke="#365f51" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="76" font-size="19" text-anchor="middle" fill="#213b33" font-weight="400">R₂ = 2</text><circle cx="480" cy="95" r="40" fill="#eaf3ee" stroke="#365f51" stroke-width="2"/><text x="480" y="104" font-size="28" text-anchor="middle" fill="#213b33" font-weight="600">B</text><text x="480" y="165" font-size="17" text-anchor="middle" fill="#66766e" font-weight="400">t = 2</text><path d="M525 95 H633" stroke="#365f51" stroke-width="2.5" marker-end="url(#arrow)"/><text x="580" y="76" font-size="19" text-anchor="middle" fill="#213b33" font-weight="400">R₃ = 6</text><rect x="637" y="55" width="86" height="80" rx="14" fill="#fceae7" stroke="#aa5145" stroke-width="2"/><text x="680" y="104" font-size="28" text-anchor="middle" fill="#213b33" font-weight="600">T</text><text x="680" y="165" font-size="17" text-anchor="middle" fill="#66766e" font-weight="400">t = 3</text>
